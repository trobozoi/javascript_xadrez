<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♟️ Xadrez - Jogue contra o Computador</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♟️</text></svg>">
</head>
<body>

    
    <!-- ===== TELA DE SELEÇÃO DE COR ===== -->
    <div id="color-selection">
        <h1>♟️ Xadrez</h1>
        <h2>Escolha sua cor para jogar contra o computador</h2>
        <div class="color-buttons">
            <button id="btn-white" class="color-btn white-btn">
                <span class="piece-icon">♔</span>
                Jogar com Brancas
            </button>
            <button id="btn-black" class="color-btn black-btn">
                <span class="piece-icon">♚</span>
                Jogar com Pretas
            </button>
        </div>
    </div>

    <!-- ===== TELA DO JOGO ===== -->
    <div id="game-screen">
        <div class="game-layout">
            <!-- Painel esquerdo - Histórico de movimentos -->
            <div class="left-panel">
                <h3>📜 Movimentos</h3>
                <div id="move-history"></div>
            </div>

            <!-- Centro - Tabuleiro -->
            <div class="board-container">
                <!-- Jogador de cima (computador) -->
                <div id="top-player" class="player-info">
                    <span class="player-icon">♚</span>
                    <span class="player-name">Computador</span>
                    <span class="captured-pieces"></span>
                </div>

                <div id="chess-board"></div>

                <!-- Jogador de baixo (humano) -->
                <div id="bottom-player" class="player-info">
                    <span class="player-icon">♔</span>
                    <span class="player-name">Você</span>
                    <span class="captured-pieces"></span>
                </div>

                <div id="status-bar" class="status-bar">Selecione uma cor para começar</div>

                <div class="game-controls">
                    <button id="btn-new-game">🔄 Novo Jogo</button>
                    <button id="btn-undo">⏪ Desfazer</button>
                    <button id="btn-flip">🔃 Girar Tabuleiro</button>
                    <button id="btn-resign">🏳️ Desistir</button>
                    <button id="btn-download-log">📥 Baixar Log</button>
                </div>
            </div>

            <!-- Painel direito - Justificativa da IA -->
            <div class="right-panel">
                <h3>🧠 Análise do Computador</h3>
                <div id="ai-justification">
                    <div style="color: #888; text-align: center; padding: 20px;">
                        Inicie um jogo para ver as análises do computador.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MODAL DE PROMOÇÃO ===== -->
    <div id="promotion-modal">
        <div class="promotion-dialog">
            <h3>Escolha a peça de promoção</h3>
            <div class="promotion-pieces"></div>
        </div>
    </div>

    <!-- ===== MODAL DE FIM DE JOGO ===== -->
    <div id="game-over-modal">
        <div class="game-over-dialog">
            <div class="result-icon"></div>
            <h2></h2>
            <div class="result-text"></div>
            <div class="game-over-buttons">
                <button id="btn-play-again" class="btn-new-game">🔄 Jogar Novamente</button>
                <button id="btn-download-final" class="btn-download-log">📥 Baixar Log da Partida</button>
                <button id="btn-close-modal" class="btn-close-modal">✖ Fechar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/engine.js"></script>
    <script src="js/openingbook.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/logger.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
